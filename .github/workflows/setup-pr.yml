name: Setup PR

# `edited` and `synchronize` are here because the link has to be *repaired*, not just written once:
# review bots replace the whole PR body with their own description, which deletes the closing
# keyword and silently unlinks the issue. Edits made with `GITHUB_TOKEN` raise no further events, so
# this cannot retrigger itself.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

# Two runs on one PR would each read the body and write it back, losing whichever wrote first.
concurrency:
  group: setup-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  setup-pr:
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      issues: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_ACTION: ${{ github.event.action }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          OPENED_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          # `head -1` closes the pipe early, and `pipefail` would turn the resulting SIGPIPE on
          # `git log` into a failed job once a PR's log outgrows the pipe buffer. `sed` drains it.
          FIRST_COMMIT=$(git log "$BASE_SHA".."$HEAD_SHA" --reverse --format="%s" | sed -n '1p')
          echo "First commit: $FIRST_COMMIT"

          # Anchored to the conventional-commit scope: unanchored, a second numeric parenthetical
          # later in the subject would match too and make this a two-line value.
          ISSUE_NUMBER=$(printf '%s' "$FIRST_COMMIT" | grep -oP '^\w+\(\K\d+(?=\))' || true)

          # The first commit is not always scoped with the issue number, so the branch name is the
          # fallback: `feature/461` and `feature/#461` both carry it.
          if [ -z "$ISSUE_NUMBER" ]; then
            ISSUE_NUMBER=$(printf '%s' "$HEAD_REF" | grep -oP '^[^/]+/#?\K\d+$' || true)
          fi

          if [ -z "$ISSUE_NUMBER" ]; then
            echo "No issue number in the first commit or the branch name, skipping."
            exit 0
          fi

          echo "Found issue number: $ISSUE_NUMBER"

          # A number that belongs to no issue is a clean skip, but an API or rate-limit error must
          # fail loudly: exiting 0 there would report success while leaving the PR unlinked.
          if ! ISSUE_TITLE=$(gh issue view "$ISSUE_NUMBER" --json title --jq '.title' 2>"$RUNNER_TEMP/issue-err"); then
            if grep -qiE 'not found|could not resolve|no issue' "$RUNNER_TEMP/issue-err"; then
              echo "Issue #$ISSUE_NUMBER does not exist, skipping."
              exit 0
            fi
            echo "Could not read issue #$ISSUE_NUMBER, failing so the run is visible and retryable:" >&2
            cat "$RUNNER_TEMP/issue-err" >&2
            exit 1
          fi

          echo "Issue title: $ISSUE_TITLE"

          # Only on open, and only while the title is still the one the PR was opened with: a run
          # queued behind a human who renamed the PR must not undo the rename.
          CURRENT_TITLE=$(gh pr view "$PR_NUMBER" --json title --jq '.title')

          if [ "$EVENT_ACTION" = "opened" ] && [ "$CURRENT_TITLE" = "$OPENED_TITLE" ]; then
            gh pr edit "$PR_NUMBER" --title "$ISSUE_TITLE"
          fi

          # GitHub reports a closing reference only while the keyword survives in the body, so this
          # one query answers both "was it ever linked" and "did something just unlink it".
          link_present() {
            gh api graphql \
              -f query='query($owner: String!, $repo: String!, $pr: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $pr) {
                    closingIssuesReferences(first: 50) { nodes { number } }
                  }
                }
              }' \
              -F owner="$OWNER" -F repo="$REPO_NAME" -F pr="$PR_NUMBER" \
              --jq "[.data.repository.pullRequest.closingIssuesReferences.nodes[].number] | index($ISSUE_NUMBER) != null"
          }

          # A here-string rather than a pipe: `grep -q` exits on the first match, and under
          # `pipefail` the producer's SIGPIPE would make a present keyword read as absent, which is
          # the one way this loop could prepend a duplicate. Case-insensitive and covering every
          # closing keyword GitHub accepts, so a human's `closes #N` counts too. The leading boundary
          # matters: without it `hotfix #N` reads as a keyword, and the repair would skip a PR that
          # GitHub has not linked at all.
          keyword_in_body() {
            grep -qiE "(^|[^[:alnum:]_])(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+#$ISSUE_NUMBER([^0-9]|$)" <<< "$1"
          }

          # A failed query must never read as "unlinked": that would send the repair off to rewrite a
          # body on no evidence.
          read_link_state() {
            if ! LINKED=$(link_present); then
              echo "Could not read the closing references of PR #$PR_NUMBER, failing so the run is visible and retryable." >&2
              exit 1
            fi
          }

          # Reading the body and writing it back cannot be atomic, so a bot writing in that window
          # wins and drops the keyword again. Re-checking after the write is what makes the repair
          # converge instead of depending on winning the race first time.
          for attempt in 1 2 3; do
            read_link_state

            if [ "$LINKED" = "true" ]; then
              echo "Issue #$ISSUE_NUMBER is linked, nothing left to do."
              exit 0
            fi

            BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body')

            if keyword_in_body "$BODY"; then
              echo "Attempt $attempt: the keyword is in the body, waiting for GitHub to index it."
              sleep 10
              continue
            fi

            echo "Attempt $attempt: issue #$ISSUE_NUMBER is not linked, restoring the closing keyword."

            # Prepended, never overwritten: the body at this point may be a bot's review description,
            # and replacing it would trade one lost piece of context for another.
            printf 'Fixes #%s\n\n%s\n' "$ISSUE_NUMBER" "$BODY" > "$RUNNER_TEMP/pr-body.md"
            gh pr edit "$PR_NUMBER" --body-file "$RUNNER_TEMP/pr-body.md"
            sleep 5
          done

          # The attempts can run out on the wait branch, with the body already carrying the keyword
          # and only GitHub's indexing outstanding. The durable state is correct there, so re-check
          # once more before calling the run failed.
          read_link_state

          if [ "$LINKED" = "true" ]; then
            echo "Issue #$ISSUE_NUMBER is linked, nothing left to do."
            exit 0
          fi

          if keyword_in_body "$(gh pr view "$PR_NUMBER" --json body --jq '.body')"; then
            echo "The closing keyword is in the body and GitHub has not indexed it yet, leaving it in place."
            exit 0
          fi

          echo "Issue #$ISSUE_NUMBER is still unlinked after 3 attempts." >&2
          exit 1
